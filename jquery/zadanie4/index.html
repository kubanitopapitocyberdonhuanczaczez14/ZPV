<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zd4</title>
    <script
  src="https://code.jquery.com/jquery-4.0.0.min.js"
  integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
  crossorigin="anonymous"></script>

    <script>
        

        $(function(){
            $("#naKoniec").click(function(){
            $("#lista").append("<li>" + produkt.value + "</li>")
            $("input").val("");
            });
            });

            $(function(){
            $("#naPoczatek").click(function(){
            $("#lista").prepend("<li>" + produkt.value + "</li>")
            $("input").val("");
            });
            });

             $(function(){
              $("#naPoczatek").click(function(){
                let tekst = $("#produkt").val();
                $("#lista").append("<li style='color: green'>" + tekst + "</li>")
                $("#produkt").val("");
              });
                $("#naKoniec").click(function(){
                let tekst = $("#produkt").val();
                $("#lista").prepend("<li style='color: blue'>" + tekst + "</li>")
                $("#produkt").val("");
              });
             });

            $(function(){
              $("#zgoda").on("change", function(){
                if(this.checked){
                  $("#wyslij").removeAttr("disabled");
                 }else{
                  $("#wyslij").attr("disabled", "disabled");
                 }
              })
            }) 
        
    </script>
    <style>

    </style>
    <label>
      <input type="checkbox" id="zgoda">Akceptuje
    </label>
    <br>
    <button id="wyslij" disabled>Wyslij</button>
     
<ul id="lista">
  <li>Chleb</li>
  <li>Mleko</li>
</ul>
<input type="text" id="produkt" placeholder="Nazwa produktu">
<button id="naKoniec">Dodaj na koniec</button>
<button id="naPoczatek">Dodaj na początek</button>

</head>
<body>
</body>
</html>
