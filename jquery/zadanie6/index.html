            let suma = 0;
            $("#lista li").each(function(){
                suma += parseInt($(this).attr("data-cena"));

            $("#suma").text(suma);

            $("#lista li").each(function(index, element){

                }

            $("#lista li").each(function(index, element){

        });

        $("#lista li").each(function(){

})
